name: pages

# The live demo at https://gallowforge.github.io/seaward/: the page as a static site, with
# the engine itself compiled to WebAssembly, reading a snapshot inside the visitor's tab.
# Nothing a visitor pastes leaves their browser: the page has no server to send it to.
# It goes out only from a commit on main that ci has passed; release.yml starts it again
# after a release, so the demo carries the new version number.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # with the tags: the demo shows the version of the latest release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/configure-pages@v6
      - name: build the demo site
        run: make pages VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
